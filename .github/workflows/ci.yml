name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: pip install -e ".[dev,all,mitm]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy (public API surface)
        run: mypy

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Trim the matrix — full coverage on Linux, smoke-test on the others.
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package + test deps
        run: pip install -e ".[dev,all,mitm]"
      - name: Run tests with coverage
        run: pytest --cov=qa_dashboard --cov-report=term-missing --cov-fail-under=65 --qa-dashboard-mitm-skip
      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          if-no-files-found: ignore

  test-core-without-mitm:
    name: Test core install without mitmproxy
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core only (no [mitm] extra)
        run: pip install -e ".[dev]"
      - name: Run tests with mitm disabled
        run: pytest --qa-dashboard-disable -q

  build:
    name: Build distributions
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install --upgrade build twine
      - name: Build wheel + sdist
        run: python -m build
      - name: Verify metadata
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
