[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-dashboard"
version = "0.10.0"
description = "Production-grade pytest HTML dashboard with unified network capture (mitmproxy / Playwright native / Selenium 4 BiDi / HAR ingest), header/body redaction, doctor health checks, multi-format export, and Allure-style static publishing to S3/GitHub Pages."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "QA Dashboard Team" }]
keywords = [
    "pytest", "dashboard", "qa", "test-report", "html-report",
    "network-capture", "mitmproxy", "playwright", "selenium",
    "allure", "static-hosting", "s3", "junit-xml", "har",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pytest>=7.0,<10",
]

[project.urls]
Repository = "https://github.com/GuruGd29/REPORTER-PROJECT"
"Bug Tracker" = "https://github.com/GuruGd29/REPORTER-PROJECT/issues"
Changelog = "https://github.com/GuruGd29/REPORTER-PROJECT/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mitm = ["mitmproxy>=11.0,<13"]
imaging = ["Pillow>=10.0"]
xlsx = ["openpyxl>=3.1"]
docx = ["python-docx>=1.1"]
export = ["openpyxl>=3.1", "python-docx>=1.1"]
publish = ["boto3>=1.34,<2"]
all = [
    "mitmproxy>=11.0,<13",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "boto3>=1.34,<2",
]
dev = [
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "boto3>=1.34,<2",
]

[project.entry-points.pytest11]
qa_dashboard = "qa_dashboard.pytest_plugin"

[project.scripts]
qa-dashboard = "qa_dashboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_dashboard"]
artifacts = [
    "src/qa_dashboard/report/templates/*",
    "src/qa_dashboard/integrations/playwright/*",
    "src/qa_dashboard/integrations/webdriverio/*",
    "src/qa_dashboard/integrations/selenium/*",
]

# -------------------------------------------------------------------
# Tooling configuration
# -------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pytest.*",
    "ignore::DeprecationWarning:_pytest.*",
]

[tool.coverage.run]
source = ["src/qa_dashboard"]
branch = true
omit = [
    "*/integrations/playwright/*.js",
    "*/integrations/webdriverio/*.js",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
skip_covered = false
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["dist", "build", ".venv", ".venv-*", "captures"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "RUF",    # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function call in default argument (FastAPI/click patterns)
    "SIM105", # try/except/pass is fine; contextlib.suppress is a style choice
    "SIM108", # ternary readability is taste
    "RUF015", # next(iter(...)) is not always more readable than list[0]
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF012"]  # assert False fine; test helper classes use mutable class attrs

[tool.mypy]
# Modules under strict mypy gate. Extended in v0.10 to cover all typed
# public modules; pytest_plugin, mitm_addon, fixtures (PIL stubs), har,
# and junit_xml have pre-existing gaps tracked for v0.11.
python_version = "3.10"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
files = [
    "src/qa_dashboard/__init__.py",
    "src/qa_dashboard/_auto_screenshot.py",
    "src/qa_dashboard/_log_capture.py",
    "src/qa_dashboard/_manifest.py",
    "src/qa_dashboard/_paths.py",
    "src/qa_dashboard/_redact.py",
    "src/qa_dashboard/bundle/builder.py",
    "src/qa_dashboard/bundle/schemas.py",
    "src/qa_dashboard/capture/step_channel.py",
    "src/qa_dashboard/doctor.py",
    "src/qa_dashboard/integrations/selenium/__init__.py",
    "src/qa_dashboard/publish.py",
    "src/qa_dashboard/report/generator.py",
]

[[tool.mypy.overrides]]
module = ["mitmproxy.*", "openpyxl.*", "docx.*", "PIL.*", "boto3", "botocore.*"]
ignore_missing_imports = true

